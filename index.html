<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="简洁、轻巧的 TOTP 动态验证码生成器。输入密钥，即刻获取验证码。">
  <title>TOTP · 动态验证码</title>
  <link rel="stylesheet" href="css/app.css?v=3.1">
  <link rel="icon" href="favicon.ico">
  <script defer src="js/vue-3.3.2.global.prod.js"></script>
  <script defer src="js/otpauth-9.1.3.min.js"></script>
  <script defer src="js/clipboard-2.0.6.min.js"></script>
  <script defer src="js/app.js?v=2.0"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="TOTP 首页">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4.5 6v5.3c0 4.5 3.1 7.7 7.5 9.7 4.4-2 7.5-5.2 7.5-9.7V6L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8.5 11.8 2.3 2.3 4.7-4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        TOTP
      </a>
      <span class="header-tag">动态验证码工具</span>
    </header>

    <noscript><p class="error-message">请启用 JavaScript，以使用动态验证码生成器。</p></noscript>

    <main id="app" v-cloak>
      <h1 class="sr-only">TOTP 动态验证码生成器</h1>

      <div class="workspace">
        <section class="settings-card" aria-labelledby="settings-title">
          <div class="card-heading">
            <div>
              <h2 id="settings-title">配置密钥</h2>
            </div>
          </div>

          <div class="field secret-field">
            <div class="label-row">
              <label for="secret-key">密钥</label>
              <button v-if="secret_key" type="button" class="text-button" @click="secret_key = ''">清空</button>
            </div>
            <input id="secret-key" class="secret-input" type="text" v-model.trim="secret_key"
              autocomplete="off" autocapitalize="characters" spellcheck="false"
              placeholder="输入 Base32 密钥" :aria-invalid="!!error">
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="digits">验证码位数</label>
              <div class="input-suffix">
                <input id="digits" type="number" v-model.number="digits" min="6" max="8" step="1" inputmode="numeric">
                <span aria-hidden="true">位</span>
              </div>
            </div>
            <div class="field">
              <label for="period">更新周期</label>
              <div class="input-suffix">
                <input id="period" type="number" v-model.number="period" min="1" max="86400" step="1" inputmode="numeric">
                <span aria-hidden="true">秒</span>
              </div>
            </div>
            <div class="field algorithm-field">
              <label for="algorithm">加密算法</label>
              <select id="algorithm" v-model="algorithm">
                <option value="SHA1">SHA-1</option>
                <option value="SHA256">SHA-256</option>
                <option value="SHA512">SHA-512</option>
              </select>
            </div>
          </div>

          <div v-if="error" class="error-message" role="alert">{{ error }}</div>
        </section>

        <section class="token-card" :class="{ 'is-ready': token }" aria-labelledby="token-title">
          <div class="token-card-top">
            <div>
              <h2 id="token-title">动态验证码</h2>
            </div>
            <span class="token-state"><span class="status-dot"></span>{{ token ? '实时更新中' : '等待输入' }}</span>
          </div>

          <div class="token-display">
            <p id="token" :class="{ 'token-placeholder': !token }" aria-label="当前验证码">{{ token || '------' }}</p>
          </div>

          <div class="countdown">
            <div class="countdown-label">
              <span>{{ token ? '距离下次更新' : '等待生成验证码' }}</span>
              <span class="countdown-value"><strong>{{ token ? updatingIn : '—' }}</strong> 秒</span>
            </div>
            <progress :value="updatingIn" :max="token ? Number(period) : 30" aria-label="验证码剩余有效时间"></progress>
          </div>

          <button type="button" id="clipboard-button" class="copy-button" :disabled="!token" aria-label="复制验证码">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/></svg>
            复制验证码
          </button>
          <p class="copy-feedback" role="status">{{ copyMessage }}</p>
        </section>
      </div>

    </main>

    <footer class="site-footer">
      <span>TOTP Generator</span>
      <span>Crafted by <a href="https://115613.xyz/">Jvz <span aria-hidden="true">↗</span></a></span>
    </footer>
  </div>
</body>

</html>
